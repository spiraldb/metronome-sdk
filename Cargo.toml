[package]
name = "metronome-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An unofficial, generated Rust client for the Metronome billing API."
readme = "README.md"
homepage = "https://github.com/spiraldb/metronome-sdk"
repository = "https://github.com/spiraldb/metronome-sdk"
documentation = "https://docs.rs/metronome-sdk"
keywords = ["metronome", "billing", "api", "client", "sdk"]
categories = ["api-bindings"]
exclude = ["spec/", "scripts/", ".claude/"]

# src/lib.rs is generated from spec/metronome-openapi.json via progenitor.
# Regenerate with: ./scripts/generate.sh  (do not hand-edit src/lib.rs).

[dependencies]
bytes = "1.9"
chrono = { version = "0.4", default-features = false, features = ["serde"] }
futures-core = "0.3"
progenitor-client = "0.14.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
uuid = { version = "1.0", features = ["serde", "v4"] }
